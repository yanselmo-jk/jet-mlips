[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jet-mlips"
version = "0.4.3"
description = "JET fused convolution kernels (jet_mlip) and LAMMPS integration for SevenNet, MACE, NequIP, Nequix and EquFlash"
requires-python = ">=3.11"
license = {text = "CC-BY-NC-SA-4.0 (LAMMPS-derived files: GPL-2.0)"}

[tool.setuptools]
packages = ["common", "jet_equflash", "jet_mace", "jet_nequip", "jet_nequix"]

[tool.pytest.ini_options]
testpaths = ["tests"]
